# Pinned project name. Without it Compose uses the directory name, so each
# worktree would get its own project: an empty DB and MiniStack when nothing else
# runs, and "port is already allocated" on 5432 when another stack runs.
# All worktrees share one stack and its volumes (logjam_postgres-data,
# logjam_ministack-data).
name: logjam

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logjam
      POSTGRES_USER: logjam
      POSTGRES_PASSWORD: logjam
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logjam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MiniStack — drop-in LocalStack-compatible AWS emulator (port 4566). Unlike
  # LocalStack Community it also EXECUTES ECS RunTask containers via the host
  # Docker socket, so topo/export/GeoPDF workers launch locally exactly as they
  # do in prod (no manual worker runs). Buckets + ECS task defs are provisioned
  # by Terraform (infra/terraform/envs/local), invoked from `make dev`/`make reset`.
  ministack:
    image: ministackorg/ministack
    environment:
      SERVICES: s3,ecs,ses,cognito,secretsmanager
      DEFAULT_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      # Not what decides where a RunTask-launched worker runs: MiniStack puts it
      # on its own container's first network by name (see `networks:` below).
      # Kept in case a MiniStack version reads it.
      DOCKER_NETWORK: logjam-local
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ministack-data:/var/lib/ministack
      # Required for ECS RunTask to spawn worker containers (Docker-out-of-Docker).
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # python3, not curl — curl is not installed in this image.
      test:
        - CMD
        - python3
        - -c
        - import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health')).get('services',{}).get('s3')=='available' else 1)
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  ministack-data:

# Fixed network name (not derived from the project directory). MiniStack runs a
# RunTask-launched worker on the first of its own container's networks by name;
# this is its only one, so workers land here and resolve `postgres` and
# `ministack`. A second network on ministack can move them off it. CI's
# topo-e2e job (ci.yml) relies on the same rule and checks where workers land.
networks:
  default:
    name: logjam-local
