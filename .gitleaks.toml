# gitleaks config for Logjam.
#
# Extends the default ruleset, then allowlists values that gitleaks' generic
# high-entropy heuristics flag but which are NOT secrets.
[extend]
useDefault = true

[allowlist]
description = "Public, non-secret identifiers safe to commit"

# Cognito App Client ID and User Pool ID are PUBLIC identifiers. The browser SPA
# needs both to sign in, so they ship in the public JS bundle
# regardless. They are not credentials — a Cognito public client has no secret,
# and the user pool's sign-in endpoints are public by design. Security comes from
# the pool's own policy, not from keeping these IDs hidden.
# Committed env *templates* hold only placeholders / empty values by design.
#
# The two mobile paths below are flagged by the generic-api-key heuristic on
# non-secret string literals: an AsyncStorage key name
# (`recordingFixRateV2`) and a test-fixture logical key (`job1/hillshade`) —
# neither is a credential.
paths = [
  '''.*\.example$''',
  '''mobile/src/tracks/recordingPreferences\.ts''',
  '''mobile/src/map/sourceResolver\.test\.ts''',
  # A syncthing in-flight copy of recordingPreferences.ts, committed once in
  # e41c1fb and removed by e96baed (which also gitignored the pattern). It lives
  # only in history; the finding is the same `recordingFixRateV2` key name.
  '''mobile/src/tracks/\.syncthing\.recordingPreferences\.ts\.tmp''',
]

regexTarget = "match"
regexes = [
  '''545ofbb8l9d1sl6ggbmk6oonn9''',          # Cognito App Client ID (public)
  '''ap-southeast-2_x5zPhJXMk''',             # Cognito User Pool ID (public)
  '''row\.s3KeyThumbnail''',                   # a Prisma field read (copyPlaceMedia.ts), not a key
  # generic-api-key reads `<display column>, <thumbnail column>` in planItems.ts
  # (its SQL select lists, and a key array in earlier, unmerged plans history)
  # as `key = value` and takes the thumbnail column name as the secret. It sits
  # here, not in a rule-scoped table, because the pre-commit hook may run
  # gitleaks 8.16, which replaces a regex-less `[[rules]]` entry instead of
  # extending the default rule.
  '''s3_?[Kk]ey_?[Dd]isplay\b[^,\n]{0,40},\s*(?:f\.)?s3_?[Kk]ey_?[Tt]humbnail\s?$''',
]
