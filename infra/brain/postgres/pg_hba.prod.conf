# No plain `host` line: a connection without TLS matches nothing and is
# refused. Guard: tests/test.sh.
# The host's scheduled jobs run as the OS user postgres inside the container
# and connect as brain_agent: host/boot.sh adds `agent postgres brain_agent` to
# the data directory's pg_ident.conf. Every other role is plain peer.
local all brain_agent peer map=agent
local all all peer
hostssl all all all scram-sha-256
