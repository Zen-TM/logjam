# One file for prod and dev (docker-compose.yml). brain-entrypoint.sh adds
# `-c config_file=` to the server command, so nothing starts without it.
# Memory settings are not here: each Compose file passes them with -c.
# Guard: tests/test.sh reads these settings back from the running server.

listen_addresses = '*'
max_connections = 50

# Logs. Row values and statement parameters never reach them: Postgres's
# default verbosity prints "Failing row contains (...)" on a constraint error.
# Mutations: log_error_verbosity = default, log_parameter_max_length = -1 or
# pgaudit.log_parameter = on each turn tests/test.sh red.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%t:%r:%u@%d:[%p]:'
log_connections = on
log_error_verbosity = terse
log_statement = 'none'
log_min_error_statement = panic
log_min_duration_statement = -1
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

shared_preload_libraries = 'pgaudit'
pgaudit.log = 'read, write, ddl, role'
pgaudit.log_parameter = off
pgaudit.log_catalog = off

# The certificate is in the data directory, so a restore brings it back.
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

wal_level = replica
archive_mode = on
archive_timeout = 60
archive_command = 'pgbackrest --stanza=logjam archive-push %p'

# Last, so it wins. Only during bootstrap: the throwaway server the official
# entrypoint runs has no certificate yet and no stanza to archive to.
# brain-entrypoint.sh makes the file and initdb/10-brain-init.sh removes it.
include_if_exists = '/var/run/postgresql/brain-bootstrap.conf'
