[tools]
# 26: one Node for every toolchain — the api image, every workflow and the
# @types/node pins. Guard: infra/scripts/check-node-version.py. The Lambda is
# still nodejs22.x (nodejs26.x is an AWS public preview), and the guard checks
# its types against that runtime instead (#229).
node = "26"
python = "3.12"
terraform = "1.13"
aws-cli = "2"
gitleaks = "8"
actionlint = "1.7"
# The one ruff pin: ci.yml's topo job reads it from here.
ruff = "0.16.9"
