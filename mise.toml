[tools]
# 22, not 20: Logjam GPS's tests and lint and the API's flow network lookup
# need node:sqlite (unflagged from 22.13), and `make verify` lints mobile from
# the repo root. CI's api, mobile and frontend jobs run 22 (jsdom 30 needs
# 22.22+); api/Dockerfile runs 26.
node = "22"
python = "3.12"
terraform = "1.13"
aws-cli = "2"
gitleaks = "8"
actionlint = "1.7"
# The one ruff pin: ci.yml's topo job reads it from here.
ruff = "0.16.9"
