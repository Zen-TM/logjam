[tools]
# 26: one Node for every toolchain, matching the @types/node pins and the api
# image. The Lambda is still nodejs22.x: its nodejs26.x successor is in public
# preview, so its @types/node hold stays until that runtime is GA (#229).
node = "26"
python = "3.12"
terraform = "1.13"
aws-cli = "2"
gitleaks = "8"
actionlint = "1.7"
# The one ruff pin: ci.yml's topo job reads it from here.
ruff = "0.16.9"
