[tools]
# 22, not 20: Logjam GPS's tests and lint need node:sqlite (Node 22.5+), and
# `make verify` lints mobile from the repo root. CI's mobile job runs 22; the
# api and frontend jobs and api/Dockerfile stay on 20.
node = "22"
python = "3.12"
terraform = "1.13"
aws-cli = "2"
gitleaks = "8"
actionlint = "1.7"
# The one ruff pin: ci.yml's topo job reads it from here.
ruff = "0.16.9"
