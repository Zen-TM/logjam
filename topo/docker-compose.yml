services:
  topo:
    build:
      context: .
      dockerfile: Dockerfile
    image: pipeline:latest
    container_name: pipeline

    # ── Volume mounts ────────────────────────────────────────
    # Place your ELVIS ZIP at ./input/elvis.zip before running.
    # Finished MBTiles will appear in ./output/
    volumes:
      - ./input:/input:ro
      - ./output:/output:rw

    # ── Resource limits ──────────────────────────────────────
    # Adjust cpus to match your machine. On cloud VMs set this
    # to the full vCPU count for fastest processing.
    deploy:
      resources:
        limits:
          cpus: "4" # ← change to your core count
          memory: "16g" # ← increase for large tiles

    # ── Environment ──────────────────────────────────────────
    environment:
      - PYTHONUNBUFFERED=1

    # ── Command ──────────────────────────────────────────────
    # The image starts the job worker by default, which needs a database, so
    # this runs the pipeline directly on /input/elvis.zip. To customise, edit
    # it (flags: topo/README.md, "Custom options"), or override at runtime:
    #   docker compose run topo python3 /app/pipeline.py /input/my_lidar.zip \
    #     --output /output --workers 8 --keep-work
    command:
      - python3
      - /app/pipeline.py
      - /input/elvis.zip
      - --output
      - /output
