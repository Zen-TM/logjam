name: Image build

# Builds the API and topo worker Docker images without pushing them, so a change
# to what an image is built from fails on the pull request instead of after
# merge: merging deploys (deploy-api.yml, deploy-topo-worker.yml), and nothing
# else builds either image first. The commands match the deploy builds.
#
# The API image is built for every architecture deploy-api.yml publishes, each
# on a native runner (the image compiles `canvas`, so no emulation), so an
# arm64-only break fails here and not after merge. `api-image` is the required
# check: it passes when every architecture's build did. pin-release.sh
# --self-test holds the platform lists to the task definitions' architectures.
#
# api-image and topo-image are required checks
# (infra/terraform/envs/github/rulesets.tf). A required check whose workflow
# never starts leaves the pull request waiting forever, so this workflow
# starts on every pull request, with no `paths:` filter, and each job decides
# inside whether its image's inputs changed
# (infra/scripts/image-build-scope.sh, which holds the list and tests it against
# the Dockerfiles). A job with nothing to build passes in seconds.
#
# The weekly build of main catches what no diff can: an upstream that moved
# under an unchanged Dockerfile, such as a base image tag or a PPA that adds or
# drops a release. A red run of it emails whoever last edited the schedule.

on:
  pull_request:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-image-build:
    name: api-image-build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the image's inputs change?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            infra/scripts/image-build-scope.sh scope api "$BASE_SHA" "$HEAD_SHA"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the API image
        if: steps.scope.outputs.build == 'true'
        run: docker build --platform ${{ matrix.platform }} -f api/Dockerfile .

  api-image:
    name: api-image
    needs: api-image-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every architecture built
        env:
          RESULT: ${{ needs.api-image-build.result }}
        run: test "$RESULT" = success

  topo-image:
    name: topo-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did the image's inputs change?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            infra/scripts/image-build-scope.sh scope worker "$BASE_SHA" "$HEAD_SHA"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the topo worker image
        if: steps.scope.outputs.build == 'true'
        run: docker build ./topo
