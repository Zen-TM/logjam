name: terraform-plan

# Plan-on-PR for envs/prod. Merge = apply (terraform-apply.yml), so this
# comment is the gate: the maintainer reads it, and the apply refuses any plan
# whose fingerprint differs from the one embedded here
# (infra/scripts/plan-summary.mjs). Read-only against AWS: the plan role has
# ReadOnlyAccess minus the privacy Deny, and -lock=false never writes state.
#
# Runs on every PR because `plan-prod` is a required check, and a
# path-filtered workflow that never starts leaves a required check pending
# forever. A PR that changes nothing the plan sees passes without planning.
# Fork PRs get no id-token: one touching infra fails here and can't merge
# until the maintainer pushes the branch in-repo.

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan-prod:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The pull_request checkout is the merge of the PR into its base; its
      # first parent is the base, so HEAD^1..HEAD is exactly the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Does this PR change what the plan sees?
        id: scope
        run: |
          if git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(infra/terraform/|infra/lambda/|infra/scripts/plan-summary|\.github/workflows/terraform-(plan|apply)\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under infra/terraform or infra/lambda: nothing to plan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.scope.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-plan-role
          aws-region: ${{ secrets.AWS_REGION }}

      - if: steps.scope.outputs.run == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false

      # The prod root's archive_file zips this Lambda's dist/. Built here and
      # in terraform-apply.yml the same way, so the source_code_hash in both
      # plans (and in the fingerprint) comes from the same bytes.
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Build cognito-email-sender Lambda
        if: steps.scope.outputs.run == 'true'
        working-directory: infra/lambda/cognito-email-sender
        run: npm ci && npm run build

      - name: terraform init
        if: steps.scope.outputs.run == 'true'
        run: terraform -chdir=infra/terraform/envs/prod init -input=false

      # -lock=false: read-only plan must not take the state lock (the plan
      # role cannot write the state bucket, and a PR plan must never block an
      # apply). The planfile stays on the runner: it can carry sensitive
      # values, and artifacts on a public repo are public.
      - name: terraform plan
        id: plan
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          cd infra/terraform/envs/prod
          terraform plan -input=false -lock=false -no-color -out=prod.tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          terraform show -json prod.tfplan > "$RUNNER_TEMP/plan.json"

      - name: Comment plan on PR
        id: comment
        if: steps.scope.outputs.run == 'true'
        env:
          OUTCOME: ${{ steps.plan.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rendered=0
          node infra/scripts/plan-summary.mjs comment "$RUNNER_TEMP/plan.txt" "$OUTCOME" \
            "$RUNNER_TEMP/plan.json" "$HEAD_SHA" > "$RUNNER_TEMP/comment.md" || rendered=$?
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- terraform-plan-prod -->"))) | .id' \
            | tail -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
          exit "$rendered"
