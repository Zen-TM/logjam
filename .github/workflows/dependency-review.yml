name: Dependency Review

# Runs GitHub Dependency Review on every pull request, so it can be a required
# check: on a PR that changes no manifest it finds nothing and passes in
# seconds. Requires the repository's Dependency graph to be enabled in
# repository settings (it fails until enabled).

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
