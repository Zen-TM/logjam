name: ota-plan

# The check for an OTA hotfix: what merging a PR labelled `ota-hotfix` would
# publish (ota-hotfix.yml), or why it can't. It patches the fix onto the
# newest release's branch as the merge would, refuses what an update must not
# carry (mobile/scripts/ota-hotfix.js), then runs Logjam GPS's checks and the
# emulator smoke on the patched tree. ota-hotfix.yml publishes only when this
# passed on the PR's head. Procedure: docs/operations/mobile-release.md.
#
# `ota-plan`, its last job, is a required check (the main ruleset). It runs
# whenever the label is on, on every push and every change of labels, and
# skips, which passes, when it is off. So a skipped run means no hotfix, a red,
# running or cancelled plan stops the merge, and a PR never reaches main under
# the label with nothing to publish: fix the plan or take the label off. A
# trigger can't filter by label, so any label change re-runs it; skipping
# there would pass the ruleset on a red plan. The labels are the event's: two
# events queued out of order (rare) can leave the older one's answer, which a
# push or a re-run corrects. No secrets: it runs the PR's own code.
# Guard: mobile/src/otaHotfix.test.ts, and infra/scripts/check-required-checks.py
# for the trigger.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

# One group for the PR: the newest event's run replaces any other, so the
# result the ruleset and ota-hotfix.yml read is always the current one.
concurrency:
  group: ota-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    if: contains(github.event.pull_request.labels.*.name, 'ota-hotfix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      base: ${{ steps.plan.outputs.base }}
      runtime: ${{ steps.plan.outputs.runtime }}
      refusal: ${{ steps.plan.outputs.refusal }}
    env:
      GIT_AUTHOR_NAME: ota-plan
      GIT_AUTHOR_EMAIL: ota-plan@users.noreply.github.com
      GIT_COMMITTER_NAME: ota-plan
      GIT_COMMITTER_EMAIL: ota-plan@users.noreply.github.com
      # Beside the checkout, not in it. runner.temp is not available here.
      TREE: ${{ github.workspace }}/../hotfix
    steps:
      # Every branch and tag: the plan looks for the newest release tag and
      # its branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            mobile/package-lock.json

      # The squash merge commits the PR's diff from where it left main, which
      # is this commit's.
      - name: Plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          squash=$(git commit-tree "$HEAD_SHA^{tree}" -p "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" -m "PR #$PR")
          node mobile/scripts/ota-hotfix.js plan "$TREE" "$squash" | tee -a "$GITHUB_OUTPUT"

      - name: Build shared
        if: steps.plan.outputs.refusal == ''
        working-directory: ${{ env.TREE }}/shared
        run: npm ci && npm run build
      - name: Lint
        if: steps.plan.outputs.refusal == ''
        working-directory: ${{ env.TREE }}/mobile
        run: npm run lint
      - name: Typecheck
        if: steps.plan.outputs.refusal == ''
        working-directory: ${{ env.TREE }}/mobile
        run: npm run typecheck
      - name: Unit tests
        if: steps.plan.outputs.refusal == ''
        working-directory: ${{ env.TREE }}/mobile
        run: npm test

      - name: Save the fix as a patch on the release branch
        if: steps.plan.outputs.refusal == ''
        env:
          BASE: ${{ steps.plan.outputs.base }}
        run: git -C "$TREE" diff --binary "$BASE" HEAD > "$RUNNER_TEMP/hotfix.patch"
      - if: steps.plan.outputs.refusal == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: ota-hotfix-patch
          path: ${{ runner.temp }}/hotfix.patch
          retention-days: 7

  smoke:
    needs: plan
    if: needs.plan.outputs.refusal == ''
    uses: ./.github/workflows/mobile-emulator.yml
    with:
      ref: ${{ needs.plan.outputs.base }}
      patch: ota-hotfix-patch

  # The plan's result, and the PR's comment.
  verdict:
    needs: [plan, smoke]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: mobile/scripts
      - name: Comment, and pass only if the hotfix may publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.plan.outputs.version }}
          RUNTIME: ${{ needs.plan.outputs.runtime }}
          REFUSAL: ${{ needs.plan.outputs.refusal }}
          PLAN: ${{ needs.plan.result }}
          SMOKE: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          node mobile/scripts/ota-hotfix.js comment > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md"
          # A fork's PR gets a read-only token: the check alone says it.
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ota-plan -->"))) | .id' \
              | tail -n1)
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            fi
          fi
          [ -z "$REFUSAL" ] && [ "$PLAN" = success ] && [ "$SMOKE" = success ]

  # The required check, and the one ota-hotfix.yml reads: `verdict`, reported
  # by a job that starts with the run and ends with it. A job that waits on
  # others (`needs`) has no check until they finish, and until then the
  # ruleset would read an older run's, a skipped one included: a labelled PR
  # could merge while its plan ran. This one waits by asking for the run's
  # jobs instead, so it is in progress for as long as the plan is, and a
  # cancelled run leaves it cancelled, which does not pass.
  ota-plan:
    if: contains(github.event.pull_request.labels.*.name, 'ota-hotfix')
    runs-on: ubuntu-latest
    # Over the sum of the jobs it waits for (15 + 5 + 60 + 5) and their queues.
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for this run's verdict, and report it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          failed=0
          while :; do
            if verdict=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "verdict" and .status == "completed") | .conclusion] | last // empty'); then
              failed=0
              [ -z "$verdict" ] || break
            elif [ $((failed += 1)) -ge 10 ]; then
              # Five minutes of refusals is not a blip: say so now, not at the timeout.
              echo "::error::GitHub would not list this run's jobs, ten times running. Re-run this job."
              exit 1
            fi
            sleep 30
          done
          echo "verdict: $verdict"
          [ "$verdict" = success ]
