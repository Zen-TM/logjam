name: expo-doctor

# Required on every PR, but it only runs for a Logjam GPS release PR: one that
# changes the version in mobile/package.json (docs/operations/mobile-release.md).
# The check compares the expo-* pins with the versions Expo currently
# publishes, so it turns red whenever a patch release lands, on commits that
# changed nothing. That is the right verdict on a release, which ships native
# code to phones that update months later, and the wrong one on every other PR:
# there it would block unrelated work for upstream drift. Fix a red release PR
# with `npx expo install --fix` in the same PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Fails open: a PR whose base version cannot be read runs the check.
      - name: Is this a release PR?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          read_version() { node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'; }
          run=true
          if [ "$EVENT" = pull_request ]; then
            base=$(git show "$BASE_SHA:mobile/package.json" | read_version) || base=
            head=$(read_version < mobile/package.json)
            if [ -n "$base" ] && [ "$base" = "$head" ]; then run=false; fi
            echo "==> version $base -> $head"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.scope.outputs.run == 'true'
        name: Install
        working-directory: mobile
        run: npm ci
      - if: steps.scope.outputs.run == 'true'
        name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor
