name: expo-doctor

# Nightly on main, not on pull requests: the check compares the expo-* pins
# with the versions Expo currently publishes, so it turns red whenever a patch
# release lands, on commits that changed nothing. That is a maintenance signal
# about main, not a verdict on a PR's diff, and a red PR check for upstream
# drift is one people learn to ignore. The deploy workflows run only after a
# green CI on main, so this must not hold a deploy back; dependency security on
# a PR is dependency-review's job.
on:
  schedule:
    - cron: "47 16 * * *" # 02:47 AEST, after the nightly CI run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci
      # Fails when an expo-* pin drifts from the SDK's own; fix with
      # `npx expo install --fix`.
      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor
