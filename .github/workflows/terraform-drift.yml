name: terraform-drift

# Nightly read-only plan of envs/prod (AWS) and envs/github (this
# repository's settings) against main. Any diff means the target and main
# disagree: a hand change, or a merged change terraform-apply.yml refused.
# Each root opens one issue, or rewrites the open one's body rather than
# commenting nightly. The plan text stays in the run log; the issue carries
# counts and destroyed addresses only.
#
# envs/github plans as the apply App, not the read-only plan App: only a
# token that may edit a ruleset sees its bypass_actors, and a bypass actor
# added by hand is the drift that matters most there. It runs main's code in
# the `prod` Environment, as terraform-apply.yml does, and never applies
# (docs/decisions/0025-github-settings-in-terraform.md).

on:
  schedule:
    - cron: "0 17 * * *" # 03:00 AEST
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: terraform-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Terraform drift in envs/prod"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # A schedule run is on main, which the plan role trusts.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-plan-role
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Build cognito-email-sender Lambda
        working-directory: infra/lambda/cognito-email-sender
        run: npm ci && npm run build

      - name: terraform init
        run: terraform -chdir=infra/terraform/envs/prod init -input=false

      # -detailed-exitcode: 0 no diff, 1 error, 2 diff.
      - name: terraform plan
        id: plan
        run: |
          cd infra/terraform/envs/prod
          code=0
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=prod.tfplan || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 1 ]

      - name: Open or update the drift issue
        if: steps.plan.outputs.code == '2'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          terraform -chdir=infra/terraform/envs/prod show -json prod.tfplan > "$RUNNER_TEMP/plan.json"
          {
            echo "The nightly plan of \`main\` against AWS is not empty. Either AWS was changed outside Terraform, or a merged change was not applied. Fix it with a PR touching infra/terraform (its plan shows the whole diff), or undo the hand change."
            echo
            node infra/scripts/plan-summary.mjs header prod "$RUNNER_TEMP/plan.json"
            echo
            echo "[Plan run]($RUN_URL)"
          } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$n" ]; then
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi

  drift-github:
    runs-on: ubuntu-latest
    environment: prod
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Terraform drift in envs/github"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # For the state only. A job in the `prod` Environment is trusted by the
      # apply role, not the plan role; -lock=false below keeps it read-only.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-apply-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: GitHub token that can see bypass actors
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SETTINGS_APPLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTINGS_APPLY_APP_KEY }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=infra/terraform/envs/github init -input=false

      # -detailed-exitcode: 0 no diff, 1 error, 2 diff.
      - name: terraform plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cd infra/terraform/envs/github
          code=0
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=github.tfplan || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 1 ]

      - name: Open or update the drift issue
        if: steps.plan.outputs.code == '2'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          terraform -chdir=infra/terraform/envs/github show -json github.tfplan > "$RUNNER_TEMP/plan.json"
          {
            echo "The nightly plan of \`main\` against this repository's GitHub settings is not empty. Either a setting was changed by hand, or a merged change was not applied. Fix it with a PR touching infra/terraform/envs/github (its plan shows the whole diff), or undo the hand change."
            echo
            node infra/scripts/plan-summary.mjs header github "$RUNNER_TEMP/plan.json"
            echo
            echo "[Plan run]($RUN_URL)"
          } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$n" ]; then
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
