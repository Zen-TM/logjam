name: setup-smoke

on:
  pull_request:
    paths:
      - "mise.toml"
      - "Makefile"
      - "package-lock.json"
      - "**/package-lock.json"
      - "topo/requirements.txt"
      - "topo/requirements*.txt"
      - "docs/dev-setup.md"
      - ".github/workflows/setup-smoke.yml"
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "Makefile"
      - "package-lock.json"
      - "**/package-lock.json"
      - "topo/requirements.txt"
      - "topo/requirements*.txt"
      - "docs/dev-setup.md"
      - ".github/workflows/setup-smoke.yml"
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  setup-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Setup and verify
        run: make setup && make verify

      - name: Unit tests (shared)
        run: cd shared && npm test

      - name: Unit tests (api)
        run: cd api && npm run test:unit

      - name: Unit tests (frontend)
        run: cd frontend && npm test

      - name: Unit tests (mobile)
        run: cd mobile && npm test

      - name: Unit tests (topo)
        working-directory: topo
        run: python -m unittest discover -s tests
