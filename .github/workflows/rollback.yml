name: Rollback

# The one rollback path. A person runs it by hand (Actions → Rollback → Run
# workflow, on main); deploy-api.yml and deploy-frontend.yml call it when their
# post-deploy smoke test fails. The same steps as plain AWS CLI, for when
# GitHub Actions itself is down: docs/operations/rollback.md.
#
#   api:      EB back to the version labelled <sha> (every deployed sha is
#             one) and the task defs that run the API image repinned
#             (infra/scripts/pin-release.sh). No migration: the schema stays
#             forward. rollback-compat.yml tests only the release that was live
#             when a migration merged against it, so going back further than
#             one release can cross a contract migration: check
#             api/prisma/migrations/ between <sha> and live first.
#   frontend: releases/<sha>/index.html copied over index.html. The deploy
#             keeps old hashed assets for 30 days, so the old index.html finds
#             its chunks. Only index.html is restored: unhashed public/ files
#             (privacy.html, tos.html, manifest.webmanifest, topo-icons/,
#             templates/) keep the newer release's content.
#   worker:   the topo task defs repinned to the <sha> image.
#
# Each target refuses before changing anything if the release is gone (ECR
# keeps 15 images per repo; the frontend prunes after 30 days).
#
# No loop: this workflow never calls itself or a deploy. If its own smoke test
# fails the run goes red and stops.
#
# The next green push to main deploys main's head again. To keep a rollback,
# revert on main.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to roll back
        type: choice
        options: [api, frontend, worker]
        required: true
      sha:
        description: Full commit sha of a release that was deployed
        type: string
        required: true
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      sha:
        type: string
        required: true

jobs:
  # GitHub keeps one pending run per concurrency group, and the next run to
  # join cancels it: a hand rollback left pending behind a deploy would be
  # dropped by the next push's deploy, and would itself cancel a pending
  # deploy. So by hand, refuse while the target's deploy is queued or running
  # rather than wait. A deploy that starts in the moment between this check
  # and the rollback taking the group can still cancel it: check the run
  # actually ran (docs/operations/rollback.md).
  preflight:
    name: No ${{ inputs.target }} deploy queued or running
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            api) WORKFLOW=deploy-api.yml ;;
            frontend) WORKFLOW=deploy-frontend.yml ;;
            worker) WORKFLOW=deploy-topo-worker.yml ;;
          esac
          BUSY=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed") | .html_url] | join(" ")')
          if [ -n "$BUSY" ]; then
            echo "::error::$WORKFLOW has a run queued or in progress ($BUSY). Run the rollback again once it has finished; it would otherwise be cancelled, or cancel that deploy."
            exit 1
          fi

  rollback:
    name: Roll ${{ inputs.target }} back to ${{ inputs.sha }}
    needs: preflight
    # preflight is skipped when a deploy calls this workflow.
    if: ${{ !cancelled() && needs.preflight.result != 'failure' }}
    # By hand: the target's deploy group, so a rollback and a deploy never
    # overlap. It must equal the group literal in the target's deploy
    # workflow: deploy-api (deploy-api.yml), deploy-frontend
    # (deploy-frontend.yml), deploy-worker (deploy-topo-worker.yml). Called
    # from a deploy: that run already holds the group, and taking it again
    # would deadlock, so the group is unique to the caller's run.
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && format('deploy-{0}', inputs.target) || format('rollback-in-run-{0}', github.run_id) }}
      cancel-in-progress: false
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TARGET: ${{ inputs.target }}
      SHA: ${{ inputs.sha }}
      REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
    steps:
      - name: Check the sha
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit sha, got '$SHA'. Called from a deploy with none, the live release was unknown before it deployed: roll back by hand (docs/operations/rollback.md)."
            exit 1
          fi

      # For infra/scripts/pin-release.sh.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Roll back the API
        if: inputs.target == 'api'
        env:
          EB_APPLICATION: ${{ secrets.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT: ${{ secrets.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          LABEL=$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_APPLICATION" --version-labels "$SHA" \
            --query 'ApplicationVersions[0].VersionLabel' --output text)
          if [ "$LABEL" != "$SHA" ]; then
            echo "::error::no EB application version labelled $SHA"; exit 1
          fi
          if ! aws ecr describe-images --repository-name logjam-api --image-ids "imageTag=$SHA" > /dev/null; then
            echo "::error::logjam-api:$SHA is no longer in ECR"; exit 1
          fi

          infra/scripts/pin-release.sh "$REGISTRY/logjam-api:$SHA"

          # A deploy that failed mid-swap can leave EB still updating, and EB
          # refuses an update until it is Ready.
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENVIRONMENT"
          # Skip the swap when it is already live: each one is a cold restart.
          CURRENT=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' --output text)
          if [ "$CURRENT" = "$SHA" ]; then
            echo "EB already runs $SHA; no swap"
          else
            echo "EB: $CURRENT -> $SHA"
            aws elasticbeanstalk update-environment --environment-name "$EB_ENVIRONMENT" \
              --version-label "$SHA" > /dev/null
          fi
          aws elasticbeanstalk wait environment-updated --environment-names "$EB_ENVIRONMENT"
          LIVE=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' --output text)
          if [ "$LIVE" != "$SHA" ]; then
            echo "::error::EB finished updating on $LIVE, not $SHA"; exit 1
          fi

      - name: Roll back the frontend
        if: inputs.target == 'frontend'
        env:
          BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          # Every file the release shipped must still be there.
          if ! aws s3 cp "s3://$BUCKET/releases/$SHA/files.txt" "$RUNNER_TEMP/files.txt"; then
            echo "::error::no releases/$SHA/ in the bucket: never deployed, deployed before releases were kept, or pruned"; exit 1
          fi
          aws s3api list-objects-v2 --bucket "$BUCKET" --output json \
            | jq -r '.Contents[]?.Key' | sort > "$RUNNER_TEMP/present.txt"
          MISSING=$(sort "$RUNNER_TEMP/files.txt" | comm -23 - "$RUNNER_TEMP/present.txt")
          if [ -n "$MISSING" ]; then
            echo "::error::release $SHA is missing files (pruned?):"; echo "$MISSING"; exit 1
          fi

          # REPLACE drops the source's headers, so each is restated.
          aws s3 cp "s3://$BUCKET/releases/$SHA/index.html" "s3://$BUCKET/index.html" \
            --metadata-directive REPLACE \
            --metadata "release-sha=$SHA" \
            --content-type "text/html" \
            --cache-control "no-cache, no-store, must-revalidate"
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/index.html" "/" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$ID"

      - name: Roll back the worker
        if: inputs.target == 'worker'
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --repository-name logjam-topo-worker --image-ids "imageTag=$SHA" > /dev/null; then
            echo "::error::logjam-topo-worker:$SHA is not in ECR. Only commits that changed topo/ built a worker image; the task def's current tag names the live one."; exit 1
          fi
          infra/scripts/pin-release.sh "$REGISTRY/logjam-topo-worker:$SHA"

  smoke:
    needs: rollback
    # !cancelled(), as on rollback: a deploy's automatic rollback skips
    # preflight, and without it the implicit success() skipped this smoke
    # test too, so nothing checked the restored release (found in the
    # 2026-10-02 drill).
    if: ${{ !cancelled() && needs.rollback.result == 'success' && inputs.target != 'worker' }}
    uses: ./.github/workflows/smoke.yml
    with:
      target: ${{ inputs.target }}
      sha: ${{ inputs.sha }}
