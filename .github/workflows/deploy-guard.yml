name: Deploy guard

# Called by the three deploy workflows before they build anything. It answers
# "should this run deploy?" and reports what is live now, which is the release
# a failed smoke test rolls back to.
#
# Three reasons to skip, each decided by infra/scripts/deploy-guard.sh (its
# --self-test runs in ci.yml's infra-scripts job):
#   - Stale: the commit is no longer main's head. The run for main's head
#     deploys this commit too, once its CI is green; if main's CI is red,
#     nothing deploys until it is fixed or re-run. FAILS CLOSED: when main's
#     head cannot be read, skip, because deploying an old sha over a newer one
#     does harm nothing afterwards undoes, while a skip loses nothing the run
#     for main's head does not ship.
#   - Nothing to deploy (frontend and worker only): nothing under the target's
#     paths changed between the LIVE release and this commit. The range starts
#     at what is live, not at this commit's parent, because stale runs skip:
#     comparing one commit alone would let a frontend change followed by a
#     docs-only merge never deploy. FAILS OPEN: a needless deploy costs
#     minutes, a silently skipped one leaves prod without a fix. Only a
#     successfully computed "nothing changed" skips.
#   - Missing config: smoke.yml's URL variables are unset (api and frontend).
#     Deploying would fail the smoke test and roll back a healthy release, so
#     the guard fails instead, before anything touches prod.

on:
  workflow_call:
    inputs:
      target:
        description: api, frontend or worker
        type: string
        required: true
      sha:
        description: The CI-validated commit the caller would deploy
        type: string
        required: true
    outputs:
      proceed:
        description: "'false' when this run must not deploy"
        value: ${{ jobs.guard.outputs.proceed }}
      deployed:
        description: The live release's commit sha, or empty when unknown
        value: ${{ jobs.guard.outputs.deployed }}

jobs:
  guard:
    name: Check freshness and scope
    # Reading what is live needs the deploy role (read-only calls only).
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      # Freshness and config win: anything but a computed "fresh" (the step
      # skipped or died included) or missing URL variables means false. Only
      # then does scope decide, and there an absent value deploys.
      proceed: ${{ (steps.fresh.outputs.proceed != 'true' || steps.config.outputs.missing == 'true') && 'false' || steps.scope.outputs.proceed }}
      deployed: ${{ steps.live.outputs.sha }}
    env:
      TARGET: ${{ inputs.target }}
      SHA: ${{ inputs.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Smoke URLs set?
        id: config
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: |
          if [ "$TARGET" != worker ] && { [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; }; then
            echo "::error::repository variables PROD_API_URL and PROD_WEB_URL must be set before $TARGET can deploy (declared in infra/terraform/envs/github). Nothing was deployed."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      # For infra/scripts/.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this commit still main's head?
        id: fresh
        run: infra/scripts/deploy-guard.sh fresh "$SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      # Where each target records the commit it runs: the EB version label, the
      # index.html object's release-sha metadata (deploy-frontend.yml writes
      # it), the topo task definition's image tag. Never fails: a lookup error
      # means "unknown", which deploys and rules out an automatic rollback.
      - name: What is live?
        id: live
        env:
          EB_ENVIRONMENT: ${{ secrets.EB_ENVIRONMENT_NAME }}
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
        run: |
          set +e
          case "$TARGET" in
            api)
              LIVE=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT" \
                --query 'Environments[0].VersionLabel' --output text) || LIVE="" ;;
            frontend)
              LIVE=$(aws s3api head-object --bucket "$FRONTEND_BUCKET" --key index.html \
                --query 'Metadata."release-sha"' --output text) || LIVE="" ;;
            worker)
              FAMILY=$(infra/scripts/pin-release.sh --families logjam-topo-worker | head -n1)
              IMAGE=$(aws ecs describe-task-definition --task-definition "$FAMILY" \
                --query 'taskDefinition.containerDefinitions[0].image' --output text) || IMAGE=""
              LIVE=${IMAGE##*:} ;;
            *) LIVE="" ;;
          esac
          # A lookup that failed, index.html from before release-sha existed,
          # or a task def Terraform reset to :latest all land here.
          if ! [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::could not tell which release of $TARGET is live (got '$LIVE'). Deploying, but a failed smoke test cannot roll back automatically."
            LIVE=""
          fi
          echo "sha=$LIVE" >> "$GITHUB_OUTPUT"
          echo "==> live: ${LIVE:-unknown}"

      - name: Anything to deploy?
        id: scope
        if: ${{ !cancelled() && steps.fresh.outputs.proceed == 'true' }}
        env:
          LIVE: ${{ steps.live.outputs.sha }}
        run: infra/scripts/deploy-guard.sh scope "$TARGET" "$LIVE" "$SHA"

      - name: Fail on missing config
        if: ${{ !cancelled() && steps.config.outputs.missing == 'true' }}
        run: exit 1
