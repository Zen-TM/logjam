name: Smoke

# Called after a deploy or a rollback: is the release we just shipped the one
# the public URLs serve, and does it answer? Public requests only, no AWS.
#   api:      /health answers and /meta reports the shipped sha.
#   frontend: / serves the shipped release's index.html (kept at
#             releases/<sha>/index.html by deploy-frontend.yml), and the entry
#             script it names loads.
# The worker has no probe: its tasks run on demand, nothing is listening.

on:
  workflow_call:
    inputs:
      target:
        description: api or frontend
        type: string
        required: true
      sha:
        description: The commit that should now be live
        type: string
        required: true
      attempts:
        description: How many 10-second tries to give it (18 is about 3 minutes; the brain's release agent is given 30)
        type: number
        default: 18

permissions: {}

jobs:
  smoke:
    name: Smoke ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe the public URL
        env:
          TARGET: ${{ inputs.target }}
          SHA: ${{ inputs.sha }}
          # Repository variables, declared in infra/terraform/envs/github.
          API_URL: ${{ vars.PROD_API_URL }}
          WEB_URL: ${{ vars.PROD_WEB_URL }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -uo pipefail
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "::error::repository variables PROD_API_URL and PROD_WEB_URL must be set (declared in infra/terraform/envs/github)"
            exit 1
          fi
          # Prints the status of every request: all 403s from the first attempt
          # usually mean the edge WAF blocked this runner's IP
          # (docs/operations/rollback.md).
          get() { curl -sSf --max-time 15 -w '%{stderr}%{http_code} %{url_effective}\n' "$@"; }

          probe_api() {
            get -o /dev/null "$API_URL/health" || return 1
            LIVE=$(get "$API_URL/meta" | jq -r .sha) || return 1
            echo "/meta sha: $LIVE"
            [ "$LIVE" = "$SHA" ]
          }

          probe_frontend() {
            local served want entry
            served=$(get "$WEB_URL/") || return 1
            want=$(get "$WEB_URL/releases/$SHA/index.html") || return 1
            if [ "$served" != "$want" ]; then
              echo "/ is not release $SHA's index.html"; return 1
            fi
            entry=$(grep -o 'src="/assets/[^"]*\.js"' <<<"$served" | head -n1 | cut -d'"' -f2)
            [ -n "$entry" ] || { echo "no entry script in index.html"; return 1; }
            get -o /dev/null "$WEB_URL$entry"
          }

          case "$TARGET" in
            api | frontend) ;;
            *) echo "::error::no smoke test for '$TARGET'"; exit 1 ;;
          esac

          # CloudFront may still hold the old index.html for a moment, and the
          # brain's release agent polls every 30 s and then pulls the image:
          # retry for ~3 minutes, or as long as the caller asks.
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if "probe_$TARGET"; then
              echo "smoke passed: $TARGET serves $SHA (attempt $attempt)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::smoke failed: $TARGET does not serve $SHA"
          exit 1
