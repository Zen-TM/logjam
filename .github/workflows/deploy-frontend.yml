name: Deploy Frontend

# Gated on CI: fires only after the `CI` workflow (ci.yml) completes
# successfully for a push to main (mirrors deploy-api.yml, INF-004). A red CI
# on that push means the deploy job's `if:` guard is false, so a failing
# test/lint/typecheck can no longer ship a build. The guard excludes
# pull_request CI runs (event == 'push'), so it does not double-fire.
# workflow_run always uses this file as it exists on the default branch.
#
# Scoping and freshness live in deploy-guard.yml: it skips a commit that is no
# longer main's head, or one that changes nothing under frontend/ or shared/
# since the live release. Freshness fails closed, scope fails open;
# deploy-guard.yml says why.
#
# Releases: hashed assets are uploaded alongside the old ones, never over them
# (no --delete), and each release's index.html is kept at
# releases/<sha>/index.html with its file list. index.html is the switch, and
# its release-sha metadata names the live release. A rollback copies an old
# releases/<sha>/index.html back (rollback.yml). The prune step deletes what is
# over 30 days old and belongs to neither this release nor the one it replaces.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One frontend deploy or rollback at a time: rollback.yml, run by hand, takes
# the same group. Not cancel-in-progress: a run cut off mid-migration or
# mid-swap is worse than a wait.
#
# GitHub keeps ONE pending run per group and cancels it when another run
# joins, whatever that run is. Two consequences:
#   - Only a run that can deploy joins. Every CI completion (a red run, a PR's,
#     a fork's from a branch named main) triggers this workflow; those get a
#     group of their own, or they would cancel a real pending deploy and then
#     skip.
#   - A newer deploy may replace a pending one, which is fine: the guard
#     deploys main's head, which includes it. But it also cancels a pending
#     hand rollback, so rollback.yml refuses to start while a deploy of its
#     target is queued or running. (`queue: max` would keep every pending run;
#     the actionlint ci.yml pins, 1.7.7, rejects the key.)
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'deploy-frontend' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-guard.yml
    with:
      target: frontend
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy:
    name: Build and deploy
    # The deploy role trusts only jobs in the `prod` Environment, which only
    # main may deploy to — a workflow pushed to any other branch can't
    # assume it.
    environment: prod
    runs-on: ubuntu-latest
    needs: guard
    # `!cancelled()` is load-bearing: with a plain `needs`, a guard job that
    # went red after deciding (say the scope lookup failed) would skip this
    # deploy. With it, only the guard's 'false' skips: stale, main unknown or
    # missing config (fail closed); scope's own errors come out 'unknown' and
    # deploy (fail open). The CI-gate conditions are repeated here rather than
    # inherited, because !cancelled() also bypasses the skip a skipped guard
    # would otherwise propagate.
    if: >-
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read
    outputs:
      switched: ${{ steps.switch.outputs.switched }}
    env:
      BUCKET: ${{ secrets.FRONTEND_S3_BUCKET }}
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Build the exact commit CI validated, not the default-branch HEAD
          # (github.sha under workflow_run can be a newer, unvalidated commit).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build shared package
        working-directory: shared
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ secrets.VITE_COGNITO_REGION }}
        run: npm run build

      # No --delete: the previous release's hashed chunks stay, so a rollback
      # is one index.html copy and an open tab lazy-loading an old chunk still
      # finds it.
      - name: Upload assets
        run: |
          aws s3 sync frontend/dist/ "s3://$BUCKET/" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Keep this release's index.html and file list
        run: |
          (cd frontend/dist && find . -type f ! -path ./index.html | sed 's|^\./||' | LC_ALL=C sort) \
            > "$RUNNER_TEMP/files.txt"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/releases/$SHA/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp "$RUNNER_TEMP/files.txt" "s3://$BUCKET/releases/$SHA/files.txt" \
            --cache-control "no-cache, no-store, must-revalidate"

      # Deletes objects over 30 days old unless this release or the live one
      # (the rollback target if this deploy's smoke test fails) needs them.
      # Which keys go is infra/scripts/frontend-prune.sh, whose --self-test
      # (ci.yml's infra-scripts job) covers the keep-list. Without the live
      # release's file list (first deploy with this step, or live release
      # unknown) it deletes nothing.
      - name: Prune old assets
        env:
          LIVE: ${{ needs.guard.outputs.deployed }}
        run: |
          set -euo pipefail
          if [ -z "$LIVE" ] || ! aws s3 cp "s3://$BUCKET/releases/$LIVE/files.txt" "$RUNNER_TEMP/live.txt"; then
            echo "::notice::no file list for the live release; nothing pruned"
            exit 0
          fi
          aws s3api list-objects-v2 --bucket "$BUCKET" --output json > "$RUNNER_TEMP/listing.json"
          infra/scripts/frontend-prune.sh "$RUNNER_TEMP/listing.json" "$RUNNER_TEMP/files.txt" \
            "$RUNNER_TEMP/live.txt" "$SHA" "$LIVE" "$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%S)" \
            > "$RUNNER_TEMP/prune.txt"
          echo "Pruning $(wc -l < "$RUNNER_TEMP/prune.txt") objects"
          while read -r key; do
            aws s3 rm "s3://$BUCKET/$key"
          done < "$RUNNER_TEMP/prune.txt"

      # From here the site may serve this release, so a failure below still
      # gets the smoke test (and its rollback).
      - name: Mark the switch
        id: switch
        run: echo "switched=true" >> "$GITHUB_OUTPUT"

      # The metadata names the live release for deploy-guard.yml.
      - name: Switch index.html to this release
        run: |
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" \
            --metadata "release-sha=$SHA" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$ID"

  smoke:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.switched == 'true' }}
    uses: ./.github/workflows/smoke.yml
    with:
      target: frontend
      sha: ${{ github.event.workflow_run.head_sha }}

  # A failed smoke test returns to the release that was live before this run.
  # If that rollback's own smoke test fails, it stops there.
  rollback:
    needs: [guard, smoke]
    if: >-
      !cancelled() &&
      needs.smoke.result == 'failure' &&
      needs.guard.outputs.deployed != github.event.workflow_run.head_sha
    uses: ./.github/workflows/rollback.yml
    with:
      target: frontend
      sha: ${{ needs.guard.outputs.deployed }}
    secrets: inherit
    # actions: read is for rollback.yml's preflight job, skipped when called
    # but still checked against what the caller grants.
    permissions:
      actions: read
      id-token: write
      contents: read
