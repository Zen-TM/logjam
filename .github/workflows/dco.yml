name: DCO

# Checks that every non-merge commit in a pull request contains a DCO
# (Developer Certificate of Origin) Signed-off-by trailer matching the author's
# email address. Commits created with the repo hooks installed receive this
# trailer automatically via scripts/dco-signoff.sh.
#
# Dependabot is exempt: a bot cannot certify the DCO, and its own trailer
# (support@github.com) never matches its author address anyway. The exemption
# needs both the PR opener and the commit author to be Dependabot, so a human
# commit pushed onto a Dependabot branch is still checked, and so is a human
# who merely sets their git author email to Dependabot's.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          RANGE="${RANGE:-${BASE_SHA}..${HEAD_SHA}}"
          echo "Checking DCO sign-off for commit range: $RANGE"

          dependabot_email="49699333+dependabot[bot]@users.noreply.github.com"

          offending=()
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            author_email="$(git log -1 --format="%ae" "$commit")"
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] && [ "${author_email,,}" = "${dependabot_email,,}" ]; then
              echo "Skipping $commit: authored by Dependabot"
              continue
            fi
            matched=false
            while IFS= read -r line; do
              if [[ "${line,,}" == *"<${author_email,,}>"* ]] || [[ "${line,,}" == *" ${author_email,,}" ]]; then
                matched=true
                break
              fi
            done < <(git log -1 --format="%B" "$commit" | grep -i "^Signed-off-by:" || true)

            if [ "$matched" = false ]; then
              offending+=("$commit")
            fi
          done < <(git rev-list --no-merges "$RANGE")

          if [ ${#offending[@]} -gt 0 ]; then
            echo "::error::The following commit(s) are missing a Signed-off-by trailer matching their author email:" >&2
            for commit in "${offending[@]}"; do
              git log -1 --format="  commit %H%n  Author: %an <%ae>%n  Date:   %ad%n%n    %s%n" "$commit" >&2
            done
            exit 1
          fi

          echo "All commits in $RANGE have a valid Signed-off-by line."
