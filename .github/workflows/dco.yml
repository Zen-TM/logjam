name: DCO

# Checks that every non-merge commit in a pull request contains a DCO
# (Developer Certificate of Origin) Signed-off-by trailer matching the author's
# email address. Commits created with the repo hooks installed receive this
# trailer automatically via scripts/dco-signoff.sh.
#
# The check itself, including the Dependabot exemption (ADR 0021), is
# scripts/dco-check.sh, which the first step self-tests.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Self-test the check
        run: scripts/dco-check.sh --self-test
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/dco-check.sh "${BASE_SHA}..${HEAD_SHA}"
