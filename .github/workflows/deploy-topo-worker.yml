name: Deploy Topo Worker

# Gated on CI: fires only after the `CI` workflow (ci.yml) completes
# successfully for a push to main (mirrors deploy-api.yml, INF-004). A red CI
# on that push means the deploy job's `if:` guard is false, so a failing
# test can no longer poison the image the next on-demand RunTask launches.
# The guard excludes pull_request CI runs (event == 'push'), so it does not
# double-fire. workflow_run always uses this file as it exists on the default
# branch.
#
# Scoping and freshness live in deploy-guard.yml: it skips a commit that is no
# longer main's head, or one that changes nothing under topo/ since the live
# release (the task def's image tag). Freshness fails closed, scope fails open;
# deploy-guard.yml says why.
#
# This scoping matters more here than for the other deploys: topo/Dockerfile
# builds from external upstreams, so every needless rebuild is another roll of
# the upstream dice — which is exactly how prod's worker got rebuilt twice for
# changes that touched no topo code at all.
#
# No smoke test or automatic rollback: these are on-demand tasks with nothing
# listening to probe. Roll back by hand with rollback.yml (target: worker).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One worker deploy or rollback at a time: rollback.yml, run by hand, takes
# the same group. Not cancel-in-progress: a run cut off mid-migration or
# mid-swap is worse than a wait.
#
# GitHub keeps ONE pending run per group and cancels it when another run
# joins, whatever that run is. Two consequences:
#   - Only a run that can deploy joins. Every CI completion (a red run, a PR's,
#     a fork's from a branch named main) triggers this workflow; those get a
#     group of their own, or they would cancel a real pending deploy and then
#     skip.
#   - A newer deploy may replace a pending one, which is fine: the guard
#     deploys main's head, which includes it. But it also cancels a pending
#     hand rollback, so rollback.yml refuses to start while a deploy of its
#     target is queued or running. (`queue: max` would keep every pending run;
#     the actionlint ci.yml pins, 1.7.7, rejects the key.)
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'deploy-worker' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: logjam-topo-worker

jobs:
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-guard.yml
    with:
      target: worker
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy:
    name: Build and push worker image
    # The deploy role trusts only jobs in the `prod` Environment, which only
    # main may deploy to — a workflow pushed to any other branch can't
    # assume it.
    environment: prod
    runs-on: ubuntu-latest
    needs: guard
    # `!cancelled()` is load-bearing: with a plain `needs`, a guard job that
    # went red after deciding (say the scope lookup failed) would skip this
    # deploy. With it, only the guard's 'false' skips: stale, main unknown or
    # missing config (fail closed); scope's own errors come out 'unknown' and
    # deploy (fail open). The CI-gate conditions are repeated here rather than
    # inherited, because !cancelled() also bypasses the skip a skipped guard
    # would otherwise propagate.
    if: >-
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Build the exact commit CI validated, not the default-branch HEAD
          # (github.sha under workflow_run can be a newer, unvalidated commit).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./topo
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # INF-009: point both topo-worker task definitions at the image just
      # pushed, by sha, so a RunTask launches this commit rather than whatever
      # the moving `:latest` tag resolves to. Nothing here waits on it — these
      # are on-demand workers with no service to roll — so the pin is the whole
      # deploy for topo/.
      - name: Pin ECS task definitions to this image (INF-009)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        # Every family that runs this image: infra/scripts/pin-release.sh.
        run: infra/scripts/pin-release.sh "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
