name: Deploy API

# Gated on CI: fires only after the `CI` workflow (ci.yml) completes
# successfully for a push to main (ARCH-001). A red CI on that push means the
# deploy job's `if:` guard is false, so a failing test/lint/typecheck can no
# longer ship an image. workflow_run does NOT support a `paths:` filter, so the
# previous api/**|shared/** path scoping is dropped — this workflow now runs
# after every green push-to-main CI, rebuilding+redeploying the (content-
# addressed, idempotent) API image even for changes outside api/shared. The
# guard excludes pull_request CI runs (event == 'push'), so it does not
# double-fire. workflow_run always uses this file as it exists on the default
# branch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  ECR_REPOSITORY: logjam-api
  EB_APPLICATION: ${{ secrets.EB_APPLICATION_NAME }}
  EB_ENVIRONMENT: ${{ secrets.EB_ENVIRONMENT_NAME }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Only deploy when the triggering CI run passed, was a push (not a PR run),
    # and targeted main. Belt-and-suspenders with the workflow_run `branches`
    # filter above.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Build the exact commit CI validated, not the default-branch HEAD
          # (github.sha under workflow_run can be a newer, unvalidated commit).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -f api/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # INF-009: point the two logjam-api task definitions at the image just
      # pushed, by sha. Both used to carry `:latest`, so what a RunTask launched
      # was whatever that moving tag happened to resolve to — including a stale
      # image if the `:latest` push failed after the sha push succeeded, which
      # would run the migration on one build and the API on another. This step
      # runs BEFORE the migration below for exactly that reason.
      - name: Pin ECS task definitions to this image (INF-009)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          for family in logjam-api-migrate logjam-geo-pdf-worker; do
            infra/scripts/pin-ecs-task-image.sh \
              "$family" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          done

      # Gated pre-deploy migration (ARCH-001 half B). Run `prisma migrate deploy`
      # in a one-shot Fargate task on the sha-pinned revision registered above, and gate
      # the EB swap on its exit code. A failing migration aborts the deploy here
      # (EB untouched, old version keeps serving) instead of crash-looping the
      # new container at boot. boot.ts no longer migrates.
      #
      # SUBNETS mirrors network.tf's `data "aws_subnet" "worker_a"/"worker_b"`,
      # which are literal ids on both sides — a human edits both or neither.
      # SECURITY_GROUP is NOT a literal any more (INF-012): it is a Terraform
      # *managed* resource, so its id is generated and a replacement mints a new
      # one, leaving a hardcoded id here silently pointing at nothing while
      # Terraform is perfectly happy. Look it up by the name Terraform sets
      # (network.tf `aws_security_group.worker`, name = logjam-worker-sg) — the
      # one identity that survives replacement. This is the SG that RDS ingress
      # admits (CP-003), so a wrong or empty value must abort, never fall back.
      - name: Run DB migrations (gated pre-deploy)
        env:
          CLUSTER: logjam-cluster
          TASK_DEF: logjam-api-migrate
          SUBNETS: subnet-0f59b0845905891be,subnet-0c10e1438a8fd0231
          WORKER_SG_NAME: logjam-worker-sg
        run: |
          set -euo pipefail
          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$WORKER_SG_NAME" \
            --query 'SecurityGroups[0].GroupId' --output text)
          if [ -z "$SECURITY_GROUP" ] || [ "$SECURITY_GROUP" = "None" ]; then
            echo "::error::no security group named $WORKER_SG_NAME — refusing to \
          guess. Check network.tf's aws_security_group.worker."; exit 1
          fi
          echo "Resolved $WORKER_SG_NAME -> $SECURITY_GROUP"
          echo "Launching migrate task ($TASK_DEF) on the newly pushed image..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task ARN (placement failure?)"; exit 1
          fi
          echo "Migrate task: $TASK_ARN — waiting for it to stop..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrate task exit code: $EXIT_CODE (stoppedReason: $STOP_REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::DB migration failed (exit $EXIT_CODE) — aborting deploy; EB unchanged. See /ecs/logjam-api-migrate logs."
            exit 1
          fi
          echo "Migrations applied cleanly; proceeding to EB deploy."

      - name: Update Dockerrun.aws.json with new image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed -i "s|logjam-api:latest|logjam-api:$IMAGE_TAG|g" api/Dockerrun.aws.json

      # Bundle .ebextensions with the Dockerrun so env-var option_settings
      # (e.g. the DB_* connection parts) apply atomically with the version
      # that requires them.
      - name: Create deployment bundle
        run: |
          cd api && zip -r deploy.zip Dockerrun.aws.json .ebextensions

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@27edd8a0ebe8656ac70654372c73f06f7e9a1027 # v22
        with:
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          application_name: ${{ env.EB_APPLICATION }}
          environment_name: ${{ env.EB_ENVIRONMENT }}
          version_label: ${{ github.event.workflow_run.head_sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: api/deploy.zip
          # Re-running a failed deploy on the same commit must reuse the already
          # uploaded version instead of erroring on the duplicate label.
          use_existing_version_if_available: true
          # The action's default post-update health wait is 30s, and this
          # environment does not reliably recover that fast: on 2026-08-29 EB
          # logged "Environment update completed successfully" at 04:59:17 and
          # went RED -> GREEN at 05:00:13 — 56s — so the action failed a deploy
          # that had in fact succeeded and was serving. A deploy reported red
          # while it is actually green is worse than a slow one: it trains
          # everyone to disbelieve red. Single-instance environments take the
          # whole app down during the swap and come back cold, so give it real
          # headroom rather than shaving it.
          wait_for_environment_recovery: 180
          wait_for_deployment: true
