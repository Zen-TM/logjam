name: Deploy API

# Gated on CI: fires only after the `CI` workflow (ci.yml) completes
# successfully for a push to main. A red CI on that push means the
# deploy job's `if:` guard is false, so a failing test/lint/typecheck cannot
# ship an image. workflow_run does NOT support a `paths:` filter, so this
# workflow runs after every green push-to-main CI, rebuilding+redeploying the
# (content-addressed, idempotent) API image even for changes outside api/shared.
# The guard excludes pull_request CI runs (event == 'push'), so it does not
# double-fire. workflow_run always uses this file as it exists on the default
# branch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One API deploy or rollback at a time: rollback.yml, run by hand, takes
# the same group. Not cancel-in-progress: a run cut off mid-migration or
# mid-swap is worse than a wait.
#
# GitHub keeps ONE pending run per group and cancels it when another run
# joins, whatever that run is. Two consequences:
#   - Only a run that can deploy joins. Every CI completion (a red run, a PR's,
#     a fork's from a branch named main) triggers this workflow; those get a
#     group of their own, or they would cancel a real pending deploy and then
#     skip.
#   - A newer deploy may replace a pending one, which is fine: the guard
#     deploys main's head, which includes it. But it also cancels a pending
#     hand rollback, so rollback.yml refuses to start while a deploy of its
#     target is queued or running. (`queue: max` would keep every pending run;
#     the actionlint ci.yml pins, 1.7.7, rejects the key.)
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'deploy-api' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: logjam-api
  EB_APPLICATION: ${{ secrets.EB_APPLICATION_NAME }}
  EB_ENVIRONMENT: ${{ secrets.EB_ENVIRONMENT_NAME }}

jobs:
  # Skips a commit that is no longer main's head (or when that cannot be
  # told), and reports the live release, which the rollback job below
  # returns to.
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-guard.yml
    with:
      target: api
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # One native build per architecture (the image compiles `canvas`, so no
  # emulation), pushed under a per-architecture tag. The deploy job below
  # joins them into the one multi-architecture <sha> and latest the rest of the
  # workflow uses. The platforms here are held to the architectures every
  # consumer runs by infra/scripts/pin-release.sh --self-test. Same
  # environment and guard as the deploy job: only main may assume the role.
  build:
    name: Build ${{ matrix.platform }}
    environment: prod
    runs-on: ${{ matrix.runner }}
    needs: guard
    if: >-
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push the per-architecture image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-${PLATFORM#linux/}
          # No attestations: ubuntu-latest's Docker uses the containerd image
          # store, which would add an untagged attestation image per
          # architecture. A release must be exactly three ECR images, which the
          # lifecycle count in ecr.tf relies on.
          docker build --provenance=false --sbom=false --platform $PLATFORM -f api/Dockerfile --build-arg GIT_SHA=$IMAGE_TAG -t $ARCH_IMAGE .
          docker push $ARCH_IMAGE

  deploy:
    name: Build and deploy
    # The deploy role trusts only jobs in the `prod` Environment, which only
    # main may deploy to — a workflow pushed to any other branch can't
    # assume it.
    environment: prod
    runs-on: ubuntu-latest
    needs: [guard, build]
    # Only deploy when the triggering CI run passed, was a push (not a PR run),
    # and targeted main. Belt-and-suspenders with the workflow_run `branches`
    # filter above. `!cancelled()` so a guard that went red after deciding
    # does not skip the deploy by itself; only its 'false' skips (stale, main
    # unknown or missing config). Both builds must have succeeded: with
    # `!cancelled()` a failed or skipped build would not stop this job alone.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read
    outputs:
      swapped: ${{ steps.swap.outputs.swapped || steps.swap_brain.outputs.swapped }}
      # How many 10-second tries the smoke job gives (the brain's release
      # agent needs longer than Elastic Beanstalk's swap), from the mode table.
      attempts: ${{ steps.mode.outputs.attempts }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact commit CI validated, not the default-branch HEAD
          # (github.sha under workflow_run can be a newer, unvalidated commit).
          ref: ${{ github.event.workflow_run.head_sha }}

      # Where this release goes, from the same file Terraform reads: one table
      # in infra/scripts/brain-setting.sh (--mode) decides every output below
      # and is tested there; nothing here decides. It fails rather than guess:
      # a file it cannot read stops the run here, with prod untouched.
      - name: Where does this release go?
        id: mode
        run: infra/scripts/brain-setting.sh --mode | tee -a "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Join the two per-architecture images into one manifest list under the
      # <sha> and latest tags. Everything below sees the same reference as
      # before: <registry>/logjam-api:<sha>, which now pulls the right
      # architecture on x86 (EB, Fargate) and on arm64.
      - name: Publish the multi-architecture image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker buildx imagetools create -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest $IMAGE:$IMAGE_TAG-amd64 $IMAGE:$IMAGE_TAG-arm64
          docker buildx imagetools inspect $IMAGE:$IMAGE_TAG
          echo "image=$IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Point the two logjam-api task definitions at the image just pushed,
      # by sha, rather than `:latest`: a moving tag can resolve to a stale image
      # if a push fails, running the migration on one build and the API on another.
      # This step runs BEFORE the migration below for exactly that reason.
      - name: Pin ECS task definitions to this image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        # Every family that runs this image: infra/scripts/pin-release.sh.
        run: infra/scripts/pin-release.sh "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # The migration runs on the revision just pinned, against the database
      # that revision names. Terraform's apply for a change to
      # brain.auto.tfvars is a separate workflow that starts at the same merge:
      # if it has not landed, the revision still names the other database and
      # this stops before the migration reaches it.
      - name: The migrate task definition names the database this mode uses
        env:
          SERVING: ${{ steps.mode.outputs.serving }}
        run: |
          set -euo pipefail
          MODE=off
          [ "$SERVING" = true ] && MODE=on
          aws ecs describe-task-definition --task-definition logjam-api-migrate \
            --query taskDefinition --output json \
            | infra/scripts/brain-setting.sh --check-taskdef "$MODE"

      # Gated pre-deploy migration. Run `prisma migrate deploy`
      # in a one-shot Fargate task on the sha-pinned revision registered above, and gate
      # the EB swap on its exit code. A failing migration aborts the deploy here
      # (EB untouched, old version keeps serving) instead of crash-looping the
      # new container at boot. boot.ts does not migrate.
      #
      # SUBNETS mirrors network.tf's `data "aws_subnet" "worker_a"/"worker_b"`,
      # which are literal ids on both sides — a human edits both or neither.
      # SECURITY_GROUP is not a literal: it is a Terraform *managed* resource,
      # so its id is generated and a replacement mints a new one, leaving a
      # hardcoded id here silently pointing at nothing while Terraform is
      # perfectly happy. Look it up by the name Terraform sets (network.tf
      # `aws_security_group.worker`, name = logjam-worker-sg) — the one identity
      # that survives replacement. This is the SG that RDS ingress admits, so a
      # wrong or empty value must abort, never fall back.
      - name: Run DB migrations (gated pre-deploy)
        env:
          CLUSTER: logjam-cluster
          TASK_DEF: logjam-api-migrate
          SUBNETS: subnet-0f59b0845905891be,subnet-0c10e1438a8fd0231
          WORKER_SG_NAME: logjam-worker-sg
        run: |
          set -euo pipefail
          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$WORKER_SG_NAME" \
            --query 'SecurityGroups[0].GroupId' --output text)
          if [ -z "$SECURITY_GROUP" ] || [ "$SECURITY_GROUP" = "None" ]; then
            echo "::error::no security group named $WORKER_SG_NAME — refusing to \
          guess. Check network.tf's aws_security_group.worker."; exit 1
          fi
          echo "Resolved $WORKER_SG_NAME -> $SECURITY_GROUP"
          echo "Launching migrate task ($TASK_DEF) on the newly pushed image..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task ARN (placement failure?)"; exit 1
          fi
          echo "Migrate task: $TASK_ARN — waiting for it to stop..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrate task exit code: $EXIT_CODE (stoppedReason: $STOP_REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::DB migration failed (exit $EXIT_CODE) — aborting deploy; EB unchanged. See /ecs/logjam-api-migrate logs."
            exit 1
          fi
          echo "Migrations applied cleanly; proceeding to EB deploy."

      - name: Update Dockerrun.aws.json with new image
        if: steps.mode.outputs.serving != 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          sed -i "s|logjam-api:latest|logjam-api:$IMAGE_TAG|g" api/Dockerrun.aws.json

      # Bundle .ebextensions with the Dockerrun so env-var option_settings
      # (e.g. the DB_* connection parts) apply atomically with the version
      # that requires them.
      - name: Create deployment bundle
        if: steps.mode.outputs.serving != 'true'
        run: |
          cd api && zip -r deploy.zip Dockerrun.aws.json .ebextensions

      # From here EB may be serving the new version, or be half way to it, so
      # a failure below still gets the smoke test (and its rollback). A
      # failure above left the old version serving untouched.
      - name: Mark the swap
        id: swap
        if: steps.mode.outputs.serving != 'true'
        run: echo "swapped=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Elastic Beanstalk
        if: steps.mode.outputs.serving != 'true'
        uses: einaregilsson/beanstalk-deploy@a67044fa332b06e68985b06d361934c28ab09007 # v23
        with:
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          application_name: ${{ env.EB_APPLICATION }}
          environment_name: ${{ env.EB_ENVIRONMENT }}
          version_label: ${{ github.event.workflow_run.head_sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: api/deploy.zip
          # Re-running a failed deploy on the same commit must reuse the already
          # uploaded version instead of erroring on the duplicate label.
          use_existing_version_if_available: true
          # The action's default post-update health wait is 30s, and this
          # environment does not reliably recover that fast: single-instance
          # environments take the whole service down during the swap and come
          # back cold. A deploy reported red while it is actually green is worse
          # than a slow one: it trains everyone to disbelieve red, so give it real
          # headroom rather than shaving it.
          wait_for_environment_recovery: 180
          wait_for_deployment: true

      # The brain's release pointer: the sha just deployed and infra/brain/api.env,
      # which the brain's release agent makes its API match once it serves.
      # With brain_serving off it comes after the EB step on purpose: EB is
      # what serves, so a failure here must not hold back that release, but it
      # still turns the run red. With it on, the pointer IS the release: the
      # EB steps are skipped, and the swap is marked once the pointer is
      # written. The role may only put this one key and not read the bucket
      # (brain_ecr.tf), so there is no read-back; the file is made first because
      # a failing script piped into `aws s3 cp -` would upload an empty pointer.
      - name: Write the brain's release pointer
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          SIGNALS_BUCKET: logjam-brain-signals-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          infra/scripts/brain-release.sh "$IMAGE_TAG" > "$RUNNER_TEMP/release.json"
          aws s3 cp "$RUNNER_TEMP/release.json" "s3://$SIGNALS_BUCKET/release.json" \
            --content-type application/json

      # The brain's swap happens on its own clock: the release agent makes the
      # API match the pointer within its poll (30 s) plus an image pull. The
      # smoke test below waits for the public /meta to name this sha, which
      # only means something once brain_public has moved CloudFront: in
      # between, the public URL is still Elastic Beanstalk's, no smoke test
      # can see the brain, and a failing one would roll back a healthy release.
      - name: Mark the swap (the brain)
        id: swap_brain
        if: steps.mode.outputs.swap_brain == 'true'
        run: echo "swapped=true" >> "$GITHUB_OUTPUT"

      - name: The brain is released but not public
        if: steps.mode.outputs.serving == 'true' && steps.mode.outputs.verify != 'true'
        run: echo "::notice::brain_public is off, so the public URL is still Elastic Beanstalk's and no smoke test can see this release. The pointer is written; check the brain through the host."

  # The smoke test is also the wait for the brain: CI may not read the brain's
  # signals bucket (infra/AGENTS.md), so "the brain runs this sha" is what the
  # public /meta says, polled for 5 minutes (the rehearsal took 49 seconds;
  # Elastic Beanstalk's swap gets the usual 3).
  smoke:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.swapped == 'true' }}
    uses: ./.github/workflows/smoke.yml
    with:
      target: api
      sha: ${{ github.event.workflow_run.head_sha }}
      attempts: ${{ fromJSON(needs.deploy.outputs.attempts || '18') }}

  # Single-instance EB: a bad release is total downtime until someone acts, so
  # a failed smoke test returns to the release that was live before this run.
  # If that rollback's own smoke test fails, it stops there (rollback.yml never
  # calls anything back).
  rollback:
    needs: [guard, smoke]
    if: >-
      !cancelled() &&
      needs.smoke.result == 'failure' &&
      needs.guard.outputs.deployed != github.event.workflow_run.head_sha
    uses: ./.github/workflows/rollback.yml
    with:
      target: api
      sha: ${{ needs.guard.outputs.deployed }}
    secrets: inherit
    # actions: read is for rollback.yml's preflight job, skipped when called
    # but still checked against what the caller grants.
    permissions:
      actions: read
      id-token: write
      contents: read
