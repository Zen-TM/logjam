name: Deploy API

# Gated on CI: fires only after the `CI` workflow (ci.yml) completes
# successfully for a push to main. A red CI on that push means the
# deploy job's `if:` guard is false, so a failing test/lint/typecheck cannot
# ship an image. workflow_run does NOT support a `paths:` filter, so this
# workflow runs after every green push-to-main CI, rebuilding+redeploying the
# (content-addressed, idempotent) API image even for changes outside api/shared.
# The guard excludes pull_request CI runs (event == 'push'), so it does not
# double-fire. workflow_run always uses this file as it exists on the default
# branch.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One API deploy or rollback at a time: rollback.yml, run by hand, takes
# the same group. Not cancel-in-progress: a run cut off mid-migration or
# mid-swap is worse than a wait.
#
# GitHub keeps ONE pending run per group and cancels it when another run
# joins, whatever that run is. Two consequences:
#   - Only a run that can deploy joins. Every CI completion (a red run, a PR's,
#     a fork's from a branch named main) triggers this workflow; those get a
#     group of their own, or they would cancel a real pending deploy and then
#     skip.
#   - A newer deploy may replace a pending one, which is fine: the guard
#     deploys main's head, which includes it. But it also cancels a pending
#     hand rollback, so rollback.yml refuses to start while a deploy of its
#     target is queued or running. (`queue: max` would keep every pending run;
#     the actionlint ci.yml pins, 1.7.7, rejects the key.)
concurrency:
  group: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'deploy-api' || format('noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: logjam-api

jobs:
  # Skips a commit that is no longer main's head (or when that cannot be
  # told), and reports the live release, which the rollback job below
  # returns to.
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/deploy-guard.yml
    with:
      target: api
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # One native build per architecture (the image compiles `canvas`, so no
  # emulation), pushed under a per-architecture tag. The deploy job below
  # joins them into the one multi-architecture <sha> and latest the rest of the
  # workflow uses. The platforms here are held to the architectures every
  # consumer runs by infra/scripts/pin-release.sh --self-test. Same
  # environment and guard as the deploy job: only main may assume the role.
  build:
    name: Build ${{ matrix.platform }}
    environment: prod
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    needs: guard
    if: >-
      !cancelled() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push the per-architecture image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-${PLATFORM#linux/}
          # No attestations: ubuntu-latest's Docker uses the containerd image
          # store, which would add an untagged attestation image per
          # architecture. A release must be exactly three ECR images, which the
          # lifecycle count in ecr.tf relies on.
          docker build --provenance=false --sbom=false --platform $PLATFORM -f api/Dockerfile --build-arg GIT_SHA=$IMAGE_TAG -t $ARCH_IMAGE .
          docker push $ARCH_IMAGE

  deploy:
    name: Build and deploy
    # The deploy role trusts only jobs in the `prod` Environment, which only
    # main may deploy to — a workflow pushed to any other branch can't
    # assume it.
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guard, build]
    # Only deploy when the triggering CI run passed, was a push (not a PR run),
    # and targeted main. Belt-and-suspenders with the workflow_run `branches`
    # filter above. `!cancelled()` so a guard that went red after deciding
    # does not skip the deploy by itself; only its 'false' skips (stale, main
    # unknown or missing config). Both builds must have succeeded: with
    # `!cancelled()` a failed or skipped build would not stop this job alone.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.guard.outputs.proceed != 'false'
    permissions:
      id-token: write
      contents: read
    outputs:
      swapped: ${{ steps.swap.outputs.swapped }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact commit CI validated, not the default-branch HEAD
          # (github.sha under workflow_run can be a newer, unvalidated commit).
          ref: ${{ github.event.workflow_run.head_sha }}

      # Whether the brain's API runs, from the same file Terraform reads (a
      # file the script cannot read stops the run here, with prod untouched).
      # It decides whether a smoke test can see this release.
      - name: Is the brain serving?
        id: serving
        run: |
          set -euo pipefail
          serving=$(infra/scripts/brain-setting.sh brain_serving)
          echo "serving=$serving" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logjam-github-actions-role
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Join the two per-architecture images into one manifest list under the
      # <sha> and latest tags. Everything below sees the same reference as
      # before: <registry>/logjam-api:<sha>, which pulls the right
      # architecture on x86 (Fargate) and on arm64 (the brain).
      - name: Publish the multi-architecture image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY
          docker buildx imagetools create -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest $IMAGE:$IMAGE_TAG-amd64 $IMAGE:$IMAGE_TAG-arm64
          docker buildx imagetools inspect $IMAGE:$IMAGE_TAG
          echo "image=$IMAGE:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Point the two logjam-api task definitions at the image just pushed,
      # by sha, rather than `:latest`: a moving tag can resolve to a stale image
      # if a push fails, running the migration on one build and the API on another.
      # This step runs BEFORE the migration below for exactly that reason.
      - name: Pin ECS task definitions to this image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        # Every family that runs this image: infra/scripts/pin-release.sh.
        run: infra/scripts/pin-release.sh "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Gated pre-deploy migration. Run `prisma migrate deploy`
      # in a one-shot Fargate task on the sha-pinned revision registered above, and gate
      # the release pointer on its exit code. A failing migration aborts the
      # deploy here (the old release keeps serving) instead of crash-looping the
      # new container at boot. boot.ts does not migrate.
      #
      # SUBNETS mirrors network.tf's `data "aws_subnet" "worker_a"/"worker_b"`,
      # which are literal ids on both sides — a human edits both or neither.
      # SECURITY_GROUP is not a literal: it is a Terraform *managed* resource,
      # so its id is generated and a replacement mints a new one, leaving a
      # hardcoded id here silently pointing at nothing while Terraform is
      # perfectly happy. Look it up by the name Terraform sets (network.tf
      # `aws_security_group.workers`, name = logjam-workers) — the one identity
      # that survives replacement. This is the SG the brain's Postgres port admits,
      # so a wrong or empty value must abort, never fall back.
      # The API launches workers into the group its own settings name, which is
      # a literal id in infra/brain/api.env. This step refuses a release whose
      # literal is not the group resolved here, before the migration runs.
      - name: Run DB migrations (gated pre-deploy)
        env:
          CLUSTER: logjam-cluster
          TASK_DEF: logjam-api-migrate
          SUBNETS: subnet-0f59b0845905891be,subnet-0c10e1438a8fd0231
          WORKER_SG_NAME: logjam-workers
        run: |
          set -euo pipefail
          SECURITY_GROUP=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=$WORKER_SG_NAME" \
            --query 'SecurityGroups[0].GroupId' --output text)
          if [ -z "$SECURITY_GROUP" ] || [ "$SECURITY_GROUP" = "None" ]; then
            echo "::error::no security group named $WORKER_SG_NAME — refusing to \
          guess. Check network.tf's aws_security_group.workers."; exit 1
          fi
          echo "Resolved $WORKER_SG_NAME -> $SECURITY_GROUP"
          API_SG=$(sed -n 's/^ECS_SECURITY_GROUPS=//p' infra/brain/api.env)
          if [ "$API_SG" != "$SECURITY_GROUP" ]; then
            echo "::error::infra/brain/api.env sets ECS_SECURITY_GROUPS=$API_SG, but $WORKER_SG_NAME is $SECURITY_GROUP. The API would launch workers into a group the brain's Postgres port may not admit. Set it to $SECURITY_GROUP."; exit 1
          fi
          echo "Launching migrate task ($TASK_DEF) on the newly pushed image..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::run-task returned no task ARN (placement failure?)"; exit 1
          fi
          echo "Migrate task: $TASK_ARN — waiting for it to stop..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrate task exit code: $EXIT_CODE (stoppedReason: $STOP_REASON)"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::DB migration failed (exit $EXIT_CODE) — aborting deploy; the release pointer is unchanged. See /ecs/logjam-api-migrate logs."
            exit 1
          fi
          echo "Migrations applied cleanly; proceeding to the release pointer."

      # The brain's release pointer: the sha just deployed and infra/brain/api.env,
      # which the brain's release agent makes its API match once it serves. The
      # pointer IS the release, and the swap is marked once it is written. The
      # role may only put this one key and not read the bucket (brain_ecr.tf),
      # so there is no read-back; the file is made first because a failing
      # script piped into `aws s3 cp -` would upload an empty pointer.
      - name: Write the brain's release pointer
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          SIGNALS_BUCKET: logjam-brain-signals-${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          infra/scripts/brain-release.sh "$IMAGE_TAG" > "$RUNNER_TEMP/release.json"
          aws s3 cp "$RUNNER_TEMP/release.json" "s3://$SIGNALS_BUCKET/release.json" \
            --content-type application/json

      # The swap happens on the brain's own clock: the release agent makes the
      # API match the pointer within its poll (30 s) plus an image pull. The
      # smoke test below waits for the public /meta to name this sha, which
      # only means something while the brain's API runs: with brain_serving off
      # no smoke test can see the release, and a failing one would roll back a
      # healthy pointer.
      - name: Mark the swap
        id: swap
        if: steps.serving.outputs.serving == 'true'
        run: echo "swapped=true" >> "$GITHUB_OUTPUT"

      - name: The brain is released but not serving
        if: steps.serving.outputs.serving != 'true'
        run: echo "::notice::brain_serving is off, so the brain's API is stopped and no smoke test can see this release. The pointer is written; check the brain through the host."

  # The smoke test is also the wait for the brain: CI may not read the brain's
  # signals bucket (infra/AGENTS.md), so "the brain runs this sha" is what the
  # public /meta says, polled for 5 minutes (the rehearsal took 49 seconds).
  smoke:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.swapped == 'true' }}
    uses: ./.github/workflows/smoke.yml
    with:
      target: api
      sha: ${{ github.event.workflow_run.head_sha }}
      attempts: 30

  # One host: a bad release is total downtime until someone acts, so
  # a failed smoke test returns to the release that was live before this run.
  # If that rollback's own smoke test fails, it stops there (rollback.yml never
  # calls anything back).
  rollback:
    needs: [guard, smoke]
    if: >-
      !cancelled() &&
      needs.smoke.result == 'failure' &&
      needs.guard.outputs.deployed != github.event.workflow_run.head_sha
    uses: ./.github/workflows/rollback.yml
    with:
      target: api
      sha: ${{ needs.guard.outputs.deployed }}
    secrets: inherit
    # actions: read is for rollback.yml's preflight job, skipped when called
    # but still checked against what the caller grants.
    permissions:
      actions: read
      id-token: write
      contents: read
