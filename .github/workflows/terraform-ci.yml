name: terraform-ci

# Static Terraform checks on PRs touching infra. Read-only: no AWS credentials,
# no backend access, no plan/apply. Catches formatting + syntax/reference errors
# before merge, and tests the plan comment and apply check
# (infra/scripts/plan-summary.mjs) that terraform-plan/-apply rely on.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/scripts/plan-summary*"
      - "infra/scripts/__fixtures__/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

jobs:
  plan-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - run: node --test infra/scripts/plan-summary.test.mjs

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/terraform

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [bootstrap, envs/prod, envs/local, envs/github]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
      # -backend=false: install providers + modules without touching remote
      # state or needing AWS credentials.
      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform/${{ matrix.root }} init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=infra/terraform/${{ matrix.root }} validate

  # The guards on the settings the security model stands on (nobody merges
  # red or unreviewed, admin-only releases, prod deployable from main only):
  # envs/github/tests/guards.tftest.hcl, offline against a mocked provider.
  test-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform/envs/github init -backend=false -input=false
      - name: terraform test
        run: terraform -chdir=infra/terraform/envs/github test
