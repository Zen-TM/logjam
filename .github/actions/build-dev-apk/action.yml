name: Build the dev APK
description: >-
  The debug build of Logjam GPS under the dev application id, for a phone or
  emulator running a local stack. Shared by dev-apk.yml (the artifact) and
  mobile-emulator.yml (the smoke check). The caller needs a checkout.

inputs:
  legacy_root:
    description: Trust the root Android before 13 lacks, which SIX Maps chains to
    default: "false"

outputs:
  apk:
    description: Path of the built APK, relative to the workspace
    value: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  cache-hit:
    description: "'true' when the APK came from the cache and Gradle never ran"
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The key is the native inputs: a change to JS reaches the APK through
    # Metro, so a JS-only change reuses the last build instead of spending 12
    # minutes on Gradle. Add a path here when a new directory feeds prebuild or
    # Gradle; this file is in the key so a change to the recipe rebuilds too.
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        key: dev-apk-v1-${{ inputs.legacy_root }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/app.config.ts', 'mobile/assets/**', 'mobile/certs/**', 'mobile/plugins/**', 'mobile/patches/**', 'mobile/modules/**', 'mobile/maplibre/**', '.github/actions/build-dev-apk/action.yml') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: mobile/package-lock.json
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: mobile
      run: npm ci
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: mobile
      env:
        LOGJAM_APP_VARIANT: dev
      run: npx expo prebuild --platform android --no-install
    - if: steps.cache.outputs.cache-hit != 'true' && inputs.legacy_root == 'true'
      shell: bash
      working-directory: mobile
      run: |
        res=android/app/src/main/res
        mkdir -p "$res/xml" "$res/raw"
        cp certs/network_security_config.xml "$res/xml/"
        cp certs/digicert_tls_rsa4096_root_g5.pem "$res/raw/"
        sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' android/app/src/main/AndroidManifest.xml
    # Phones and the x86_64 emulator: the other two ABIs add build time and no device.
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: mobile/android
      env:
        LOGJAM_APP_VARIANT: dev
      run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
    # Saved here, not by a post step, so a later failure in the caller (a flaky
    # emulator) does not throw away 12 minutes of Gradle.
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
        key: ${{ steps.cache.outputs.cache-primary-key }}
