version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/infra/lambda/cognito-email-sender"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/bootstrap"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/envs/local"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/envs/prod"
    schedule:
      interval: "monthly"
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/scripts/basemap"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/shared"
    schedule:
      interval: "monthly"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/topo"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns:
          - "*"
    # A new Ubuntu release is a migration, not a bump: the image gets PDAL and
    # GDAL from a PPA that must publish that release first (see topo/Dockerfile).
    # Both majors (24.04 -> 26.04) and minors are ignored: 24.10, an interim
    # release, reads as a minor bump of 24.04. Digest refreshes of the pinned
    # 24.04 still arrive.
    ignore:
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    directory: "/topo"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns:
          - "*"
