# Real sign-in on Logjam GPS's own landing screen (ADR 0045), which draws its
# forms under a Cognito issuer. Needs EXPO_PUBLIC_AUTH_MODE=oidc plus
# EXPO_PUBLIC_OIDC_ISSUER (a Cognito one) and EXPO_PUBLIC_OIDC_CLIENT_ID in
# mobile/.env, and a confirmed test user (operator-provided — never a real
# account, never committed creds; privacy rule mirrors
# frontend/e2e/auth-lifecycle.spec.ts):
#
#   MAESTRO_TEST_EMAIL=... MAESTRO_TEST_PASSWORD=... \
#     maestro test e2e/signin.yaml
#
# NOT verified on a device: run it once by hand on a phone and fix the
# selectors before relying on it. Under another issuer the screen is one
# button to the provider's page instead, which this flow does not drive. A new
# account also meets the welcome screen only if sign-up could not record its
# consent, which this flow does not drive: use a test user that has already
# consented.
appId: com.logjamnsw.mobile
env:
  TEST_EMAIL: ${MAESTRO_TEST_EMAIL}
  TEST_PASSWORD: ${MAESTRO_TEST_PASSWORD}
---
- openLink: "exp+logjam-mobile://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Create an account"
    timeout: 30000
- tapOn: "Email"
- inputText: ${TEST_EMAIL}
- tapOn: "Password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
# The shell opens once finishSignIn has settled whose phone this is.
- extendedWaitUntil:
    visible: "Places"
    timeout: 60000
- tapOn: "Account"
- assertVisible: "Sign out"
